[project]
name = "claude-harness"
version = "0.2.0"
description = "A Claude Code harness: workflow skills, templates and hooks. Tools use the standard library only."
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
extend-exclude = ["plugin/skills", "plugin/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
